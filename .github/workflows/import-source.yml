name: Import Blender render audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand source archive
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('atlas-source.zip')
          expected = '98eca763744d7384488f560d7bd16dbc7b5cd81d342650260867913bd0ecdf80'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  target = pathlib.Path(item.filename)
                  assert not target.is_absolute() and '..' not in target.parts
                  if not item.filename.startswith('.github/'):
                      bundle.extract(item)
          archive.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Blender render audit'
          git push
