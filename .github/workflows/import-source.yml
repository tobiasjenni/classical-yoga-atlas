name: Import contact audit update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and synchronize source archive
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          archive = pathlib.Path('atlas-source.zip')
          expected = '534b74e1cc46c6219f8cf073f2d7ebfaa56d06353fd392a90df88a3bbe00a947'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              for item in bundle.infolist():
                  target = pathlib.Path(item.filename)
                  assert not target.is_absolute() and '..' not in target.parts
                  assert (root / target).resolve().is_relative_to(root)
              tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              for filename in tracked:
                  if not filename or filename.startswith('.github/') or filename == 'atlas-source.zip':
                      continue
                  if filename not in names:
                      target = (root / filename).resolve()
                      assert target.is_relative_to(root)
                      if target.is_file():
                          target.unlink()
              for item in bundle.infolist():
                  if not item.filename.startswith('.github/'):
                      bundle.extract(item)
          archive.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit all 108 contacts and add trilingual descriptions'
          git push
